[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tinyhumans"
version = "0.1.0"
description = "Python SDK for the TinyHumans backend"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "TinyHumans AI" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/tinyhumans"]

[tool.pytest.ini_options]
addopts = "--cov=tinyhumans --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["tinyhumans"]
omit = ["tests/*"]
